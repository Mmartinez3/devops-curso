name: demo github action

on:
  push:
    branches:
      - devops-simple-node1
  pull_request:
    branches:
      - devops-simple-node1
  workflow_dispatch:

env: 
  REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  REPOSITORY: ${{ github.event.repository.name }}

jobs:
  init:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 21

      - name: Install dependencies
        run: npm install

  test:
    needs: init
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 21

      - name: Run tests
        run: npm run test

  deploy_to_dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: develop
      url: https://demo-dev.codigofacilito.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image 
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: peperro/app:${{ github.sha }}

  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
      url: https://demo.codigofacilito.com
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image 
        uses: docker/build-push-action@v6.15.0
        with:
          context: .

          push: true
          tags: peperro/app:v3
